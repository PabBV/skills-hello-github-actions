name: Stats
on: 
  push:
    branches: : [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      # Give the default GITHUB_TOKEN write permission to commit and push the changed 
      # files back to the repository.
      contents: write
      
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11' 

      - name: Run script
        run: python ./Roadmap/stats.py

      - name: Commit and push changes
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: Update stats
          commit_user_name: Pablo Valverde
          commit_user_email: pablo211@hotmail.com
          commit_autor: PabloValverd
          
